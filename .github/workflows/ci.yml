name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # GitHub-hosted by default. Repository variable CI_RUNS_ON can point the
    # jobs at a self-hosted runner (e.g. ["self-hosted","linux","x64"]).
    # The `if:` below is the fork guard and MUST stay on every job: it runs
    # pull requests only from branches of this repository, so a fork's PR
    # never executes its code on a self-hosted runner. Never switch the
    # trigger to pull_request_target.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - name: Python and git on the runner
        run: python3 --version && git --version
      - name: Byte-compile
        run: python3 -m compileall -q mod_browser tests
      - name: Tests (HTTP API with a fake Server port, and the RCON adapter)
        run: python3 -m unittest discover -s tests -t . -v

  # The site is Internet-facing and the repo is public: nothing in it may hold a credential.
  # History is scanned in full on every run because a leak in any commit is permanent.
  secrets:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The tarball is checked against its published sha256 (read 2026-11-12)
      # before anything from it runs on the shared runner.
      - name: gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose
